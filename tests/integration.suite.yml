actor: IntegrationTester
modules:
    enabled:
        - Asserts
        - lucatume\WPBrowser\Module\WPLoader
        - \Helper\Integration
    config:
        lucatume\WPBrowser\Module\WPLoader:
            wpRootFolder: "%ROOT_FOLDER%"
            dbUrl: "mysql://%DB_USER%:%DB_PASSWORD%@%DB_HOST%/%DB_NAME%"
            tablePrefix: "%TABLE_PREFIX%"
            domain: "%DOMAIN%"
            adminEmail: "%ADMIN_EMAIL%"
            title: "Test"
